name: Bug report
description: Something in faultkit does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security issue, use the [security policy](https://github.com/Sahil-coder-30/faultkit/security/policy) instead.
  - type: input
    id: version
    attributes:
      label: faultkit version
      placeholder: "1.2.1"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version and framework
      placeholder: "Node 22.11, Express 4.21"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the response body or log line you got.
    validations:
      required: true
