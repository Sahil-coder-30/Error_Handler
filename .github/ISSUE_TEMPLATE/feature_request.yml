name: Feature request
description: Suggest a new error class, framework adapter, or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would the API look? A code sample helps.
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
