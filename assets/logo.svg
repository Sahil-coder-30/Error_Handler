<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">faultkit</title>
  <desc id="desc">An isometric package box with a glowing fault crack contained inside it, and a wrench in front.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="crack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- dark outline plus soft shadow so the wrench reads in front of the box -->
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="4" result="soft"/>
      <feOffset in="soft" dx="0" dy="4" result="shadow"/>
      <feFlood flood-color="#0B1020"/>
      <feComposite in2="fat" operator="in" result="ring"/>
      <feFlood flood-color="#0B1020" flood-opacity="0.6"/>
      <feComposite in2="shadow" operator="in" result="drop"/>
      <feMerge>
        <feMergeNode in="drop"/>
        <feMergeNode in="ring"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cube">
      <path d="M128 40 L204 84 L204 172 L128 216 L52 172 L52 84 Z"/>
    </clipPath>
    <!-- open-end jaw and hang hole cut out of the wrench -->
    <mask id="wrench-cut" maskUnits="userSpaceOnUse" x="-40" y="-40" width="160" height="80">
      <rect x="-40" y="-40" width="160" height="80" fill="#fff"/>
      <rect x="-40" y="-8" width="32" height="16" fill="#000"/>
      <circle cx="-8" cy="0" r="8" fill="#000"/>
      <circle cx="84" cy="0" r="4.5" fill="#000"/>
    </mask>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="116" fill="url(#halo)"/>

  <!-- the kit -->
  <g transform="translate(5.4 3.4) scale(0.88)">
    <g stroke-linejoin="round" stroke-width="6">
      <path d="M128 40 L204 84 L128 128 L52 84 Z" fill="url(#top)" stroke="url(#top)"/>
      <path d="M52 84 L128 128 L128 216 L52 172 Z" fill="url(#left)" stroke="url(#left)"/>
      <path d="M204 84 L204 172 L128 216 L128 128 Z" fill="url(#right)" stroke="url(#right)"/>
    </g>

    <g fill="none" stroke="#EDE9FE" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55" stroke-width="2">
      <path d="M52 84 L128 128 L204 84"/>
      <path d="M128 128 L128 216" stroke-opacity="0.3"/>
    </g>

    <!-- the fault: a crack that runs across the box but never leaves it -->
    <g clip-path="url(#cube)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 120 L76 142 L90 126 L110 162 L128 154 L146 172 L164 142 L184 150 L212 120"
            stroke="#0B1020" stroke-width="11"/>
      <path d="M44 120 L76 142 L90 126 L110 162 L128 154 L146 172 L164 142 L184 150 L212 120"
            stroke="url(#crack)" stroke-width="4" filter="url(#glow)"/>
    </g>
  </g>

  <!-- the fix: a wrench centered on the box front, where the fault is caught -->
  <g filter="url(#outline)">
    <g transform="translate(140 117) rotate(135) scale(0.9)">
      <g mask="url(#wrench-cut)" fill="url(#steel)">
        <circle cx="0" cy="0" r="22"/>
        <rect x="4" y="-9" width="88" height="18" rx="9"/>
      </g>
    </g>
  </g>
</svg>
