<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">faultkit</title>
  <desc id="desc">An isometric kit box with a gold wrench emblem on its lid and a glowing fault crack held inside its walls.</desc>
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C7FF7"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2E1A87"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="0.3" stop-color="#FDE047"/>
      <stop offset="0.7" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="magma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="0.5" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spill" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="floor" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="walls">
      <path d="M48.5 82 L128 128 L207.5 82 L207.5 174 L128 220 L48.5 174 Z"/>
    </clipPath>
    <clipPath id="lid-clip">
      <path d="M128 40 L204 84 L128 128 L52 84 Z"/>
    </clipPath>

    <path id="crack" d="M40 128 L70 144 L84 130 L106 166 L128 156 L148 176 L166 146 L186 156 L216 130"/>

    <!-- open-end jaw and hang hole, in the wrench's own flat coordinates -->
    <mask id="wrench-cut" maskUnits="userSpaceOnUse" x="-40" y="-40" width="160" height="80">
      <rect x="-40" y="-40" width="160" height="80" fill="#fff"/>
      <rect x="-40" y="-7.5" width="33" height="15" fill="#000"/>
      <circle cx="-7" cy="0" r="7.5" fill="#000"/>
      <circle cx="66" cy="0" r="4.5" fill="#000"/>
    </mask>
    <!-- flat wrench: jaw at the origin, handle along +x -->
    <g id="wrench-flat" mask="url(#wrench-cut)">
      <circle cx="0" cy="0" r="21"/>
      <path d="M8 -8.5 L68 -7 A7 7 0 0 1 68 7 L8 8.5 Z"/>
      <circle cx="66" cy="0" r="10"/>
    </g>
    <!-- the same wrench laid flat on the lid: maps the square [-50,50] onto the lid rhombus -->
    <g id="wrench-lid">
      <g transform="matrix(0.76 -0.44 0.76 0.44 128 84)">
        <g transform="scale(0.94) rotate(180) translate(-27.5 0)">
          <use href="#wrench-flat"/>
        </g>
      </g>
    </g>
  </defs>

  <!-- no background: the icon is transparent and tuned for light and dark pages -->
  <g transform="translate(128 120) scale(1.2) translate(-128 -128)">
    <ellipse cx="128" cy="220" rx="62" ry="8" fill="#4C1D95" opacity="0.4" filter="url(#floor)"/>

    <!-- box -->
    <g stroke-linejoin="round" stroke-width="7">
      <path d="M52 84 L128 128 L128 216 L52 172 Z" fill="url(#left)" stroke="url(#left)"/>
      <path d="M204 84 L204 172 L128 216 L128 128 Z" fill="url(#right)" stroke="url(#right)"/>
      <path d="M128 40 L204 84 L128 128 L52 84 Z" fill="url(#lid)" stroke="url(#lid)"/>
    </g>

    <!-- lid seam, rim light and front edge -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 100 L128 145 L206 100" stroke="#1E1050" stroke-opacity="0.45" stroke-width="2.5"/>
      <path d="M50 102.5 L128 147.5 L206 102.5" stroke="#C7D2FE" stroke-opacity="0.3" stroke-width="1"/>
      <path d="M52 84 L128 128 L204 84" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2"/>
      <path d="M128 149 L128 213" stroke="#C7D2FE" stroke-opacity="0.3" stroke-width="1.5"/>
    </g>

    <!-- the fault: a hot crack that runs around the walls but never escapes them -->
    <g clip-path="url(#walls)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#crack" stroke="#F97316" stroke-width="12" opacity="0.55" filter="url(#spill)"/>
      <use href="#crack" stroke="#120A2E" stroke-width="9.5"/>
      <use href="#crack" stroke="url(#magma)" stroke-width="4.5" filter="url(#glow)"/>
      <use href="#crack" stroke="#FFFBEB" stroke-width="1.4"/>
    </g>

    <!-- the fix: a raised gold wrench emblem on the lid -->
    <g clip-path="url(#lid-clip)">
      <use href="#wrench-lid" fill="#2E1065" opacity="0.5" transform="translate(3 7)" filter="url(#soft)"/>
    </g>
    <use href="#wrench-lid" fill="#7C2D12" transform="translate(0 4)"/>
    <use href="#wrench-lid" fill="#9A3412" transform="translate(0 2.6)"/>
    <use href="#wrench-lid" fill="#C2410C" transform="translate(0 1.2)"/>
    <use href="#wrench-lid" fill="url(#gold)"/>
  </g>
</svg>
